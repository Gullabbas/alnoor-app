name: alnoor
description: "Al Noor Diagnostic Centre Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  shared_preferences: ^2.5.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_animate: ^4.5.2
  intl: 0.20.2
  uuid: ^4.6.0
  url_launcher: ^6.3.2
  fl_chart: ^1.3.0
  qr_flutter: ^4.1.0
  shimmer: ^3.0.0
  confetti: ^0.8.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/images/
